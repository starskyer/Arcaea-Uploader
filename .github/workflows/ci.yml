name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux display and audio tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg python3-tk
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -q
      - name: Test with a display on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -q

  distributions:
    name: Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist --write-checksums
      - name: Install built wheel
        run: |
          python -m pip uninstall -y arcaea-uploader
          python -m pip install dist/*.whl
          python -I -c "from importlib.resources import files; from arcaea_uploader import __version__; assert files('arcaea_uploader._vendor.arcaea_bundler').joinpath('LICENSE').is_file(); print(__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
